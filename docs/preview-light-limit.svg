<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-label="Quota Line subscription limits strip: 5h, weekly and monthly windows, light theme">
  <defs>
    <filter id="panel-shadow" x="-10%" y="-40%" width="120%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#0F1115" flood-opacity="0.07"/>
    </filter>
    <filter id="composer-shadow" x="-5%" y="-20%" width="110%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0F1115" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="960" height="210" fill="#FFFFFF"/>

  <g filter="url(#panel-shadow)">
    <rect x="40" y="40" width="880" height="36" rx="9" fill="#FDFDFE" stroke="#ECEDF0"/>
  </g>

  <circle cx="58" cy="58" r="3.5" fill="#22C55E"/>
  <text x="68" y="62.5" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F1115">Kimi Code</text>

  <!-- 5h window: info (sky blue) tone -->
  <rect x="144" y="46" width="64" height="24" rx="12" fill="#DDF2FC" stroke="#A6DAF1"/>
  <text x="176" y="62.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13"><tspan fill="#61666B">5h </tspan><tspan fill="#0F1115">42%</tspan></text>

  <!-- Weekly window: success tone (same as Bonus) -->
  <rect x="216" y="46" width="92" height="24" rx="12" fill="#E0F7E9" stroke="#ADE5C2"/>
  <text x="262" y="62.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13"><tspan fill="#61666B">Weekly </tspan><tspan fill="#0F1115">78%</tspan></text>

  <!-- Monthly window: warning tone -->
  <rect x="316" y="46" width="100" height="24" rx="12" fill="#FDF1DD" stroke="#F5D7A5"/>
  <text x="366" y="62.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13"><tspan fill="#61666B">Monthly </tspan><tspan fill="#0F1115">92%</tspan></text>

  <text x="840" y="62.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#61666B">updated 16:47:05</text>

  <!-- Refresh: same 24px pill and 13px text as the value chips -->
  <rect x="848" y="46" width="66" height="24" rx="12" fill="#FDE3E3" stroke="#F2B1B1"/>
  <text x="881" y="62.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#0F1115">Refresh</text>

  <g filter="url(#composer-shadow)">
    <rect x="40" y="88" width="880" height="64" rx="14" fill="#FFFFFF" stroke="#E7E8EA"/>
  </g>
  <text x="64" y="124" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#9BA1A8">Message DeepSeek…</text>
  <circle cx="888" cy="120" r="14" fill="#0F1115"/>
  <path d="M888 126v-11m0 0-4.5 4.5M888 115l4.5 4.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="40" y="184" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#61666B">Light theme · subscription usage windows (5h / weekly / monthly)</text>
</svg>
