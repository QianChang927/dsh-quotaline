<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-label="Quota Line subscription limits strip: 5h, weekly and monthly windows, dark theme">
  <defs>
    <filter id="panel-shadow" x="-10%" y="-40%" width="120%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="composer-shadow" x="-5%" y="-20%" width="110%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="210" fill="#151517"/>

  <g filter="url(#panel-shadow)">
    <rect x="40" y="40" width="880" height="36" rx="9" fill="#26272B" stroke="#34363A"/>
  </g>

  <circle cx="58" cy="58" r="3.5" fill="#22C55E"/>
  <text x="68" y="62.5" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#F9FAFB">Kimi Code</text>

  <!-- 5h window: info (sky blue) tone -->
  <rect x="144" y="46" width="82" height="24" rx="12" fill="#283D48" stroke="#2A5D76"/>
  <text x="185" y="62.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13"><tspan fill="#CFD3D6">5h </tspan><tspan fill="#F9FAFB">42% used</tspan></text>

  <!-- Weekly window: success tone (same as Bonus) -->
  <rect x="234" y="46" width="112" height="24" rx="12" fill="#2B4133" stroke="#316845"/>
  <text x="290" y="62.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13"><tspan fill="#CFD3D6">Weekly </tspan><tspan fill="#F9FAFB">78% used</tspan></text>

  <!-- Monthly window: warning tone -->
  <rect x="354" y="46" width="118" height="24" rx="12" fill="#483C27" stroke="#785B29"/>
  <text x="413" y="62.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13"><tspan fill="#CFD3D6">Monthly </tspan><tspan fill="#F9FAFB">92% used</tspan></text>

  <text x="840" y="62.5" text-anchor="end" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#CFD3D6">updated 16:47:05</text>

  <!-- Refresh: same 24px pill and 13px text as the value chips -->
  <rect x="848" y="46" width="66" height="24" rx="12" fill="#443232" stroke="#704242"/>
  <text x="881" y="62.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#F9FAFB">Refresh</text>

  <g filter="url(#composer-shadow)">
    <rect x="40" y="88" width="880" height="64" rx="14" fill="#232324" stroke="#33353A"/>
  </g>
  <text x="64" y="124" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#7B8187">Message DeepSeek…</text>
  <circle cx="888" cy="120" r="14" fill="#F9FAFB"/>
  <path d="M888 126v-11m0 0-4.5 4.5M888 115l4.5 4.5" fill="none" stroke="#151517" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="40" y="184" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#CFD3D6">Dark theme · subscription usage windows (5h / weekly / monthly)</text>
</svg>
